name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a mvn -B test 2>&1 | tee build.log

      # 失敗した理由を、ログを開かなくても GitHub の画面（注釈）で読めるようにする
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -q -E "<<< (FAILURE|ERROR)" "$f"; then
              msg=$(grep -A4 -E "<<< (FAILURE|ERROR)" "$f" | head -n 30 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=$(basename "$f" .txt)::$msg"
            fi
          done
          grep -E '^\[ERROR\] .*\.java' build.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=compile::${line//%/%25}"
          done
