version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 11.5 以降は Java 21 向けにビルドされていて、Java 17 では読めない
      - dependency-name: com.miglayout:miglayout-swing
        versions: [">= 11.5"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
